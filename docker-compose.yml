services:

  mysql:

    image: mysql:8.0

    container_name: employee-mysql

    restart: unless-stopped

    environment:
      MYSQL_DATABASE: employee_db
      MYSQL_USER: employee
      MYSQL_PASSWORD: employee123
      MYSQL_ROOT_PASSWORD: root123

    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    networks:
      - employee-network


  backend:

    build:
      context: ./backend

    container_name: employee-backend

    restart: unless-stopped

    depends_on:
      - mysql

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/employee_db
      SPRING_DATASOURCE_USERNAME: employee
      SPRING_DATASOURCE_PASSWORD: employee123

    expose:
      - "8080"

    networks:
      - employee-network


  frontend:

    build:
      context: ./frontend

    container_name: employee-frontend

    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "80:80"

    networks:
      - employee-network


networks:

  employee-network:
    driver: bridge


volumes:

  mysql_data:
