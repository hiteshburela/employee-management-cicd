<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Employee Management System</title>

    <link rel="stylesheet"
          href="css/style.css">
</head>

<body>

<header>
    <h1>Employee Management System</h1>
    <p>3-Tier CI/CD Application</p>
</header>

<main>

    <!-- Add Employee -->
    <section class="form-section">

        <h2>Add Employee</h2>

        <form id="employeeForm">

            <input
                type="text"
                id="name"
                placeholder="Employee Name"
                required
            >

            <input
                type="email"
                id="email"
                placeholder="Email"
                required
            >

            <input
                type="text"
                id="department"
                placeholder="Department"
                required
            >

            <input
                type="number"
                id="salary"
                placeholder="Salary"
                required
            >

            <button type="submit">
                Add Employee
            </button>

        </form>

    </section>


    <!-- Employee List -->
    <section class="employees-section">

        <h2>Employees</h2>

        <button onclick="loadEmployees()">
            Refresh Employees
        </button>

        <table>

            <thead>

                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Department</th>
                    <th>Salary</th>
                    <th>Action</th>
                </tr>

            </thead>

            <tbody id="employeeTableBody">

            </tbody>

        </table>

    </section>

</main>

<script src="js/app.js"></script>

</body>

</html>
